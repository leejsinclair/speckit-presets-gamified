# Questmaster's own extension manifest — the actual artifact `specify extension add questmaster`
# (or `specify extension add --dev ./extensions/questmaster` during development) installs from.
#
# This is the live source of truth for the shipped extension; specs/001-questmaster-quest-layer/
# contracts/extension.yml is the design-phase copy this was created from (tasks.md T002) and is
# kept for traceability, not read by anything at runtime.
#
# Schema confirmed against github/spec-kit's real extension mechanism
# (src/specify_cli/extensions/__init__.py, extensions/EXTENSION-DEVELOPMENT-GUIDE.md,
# extensions/git/extension.yml as a working precedent) — see research.md §1/§4/§12 for the
# evidence trail.

schema_version: "1.0"

extension:
  id: "questmaster"
  name: "Questmaster"
  version: "1.0.0"
  description: "A quest layer for Spec Kit: Socratic problem-framing before specification, banded Integrity scoring, developer-judgment tracking, and Drift Classification across Story/Spec/Plan"
  author: "Lee Sinclair"
  repository: "https://github.com/leejsinclair/speckit-presets-gamified"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"
  # No external tools — deliberately (Constitution: Scope & Technology Constraints; FR-028)

# Commands MUST follow speckit.<ext-id>.<cmd> (enforced by the extension safety check —
# ARCHITECTURE.md — and by HookExecutor._skill_name_from_command, which only produces a
# correct agent invocation string for speckit.-prefixed command ids). For Claude, each
# renders to .claude/skills/speckit-questmaster-<cmd>/SKILL.md, invoked as
# /speckit-questmaster-<cmd> (CommandRegistrar._compute_output_name).
provides:
  commands:
    - name: "speckit.questmaster.story"
      file: "commands/speckit.questmaster.story.md"
      description: "Storyteller: Socratic interview + Dragon Pass, produces story.md with a banded Story Integrity Assessment and readiness classification"
      # Free-form aliases are permitted (no pattern enforcement — see e.g. "speckit.verify"
      # short aliases used by existing extensions) but still render through the same
      # speckit-<name> path, so the friendliest achievable short form is /speckit-quest-story,
      # not the original brief's bare /quest-story.
      aliases: ["speckit.quest-story"]

    - name: "speckit.questmaster.check-spec"
      file: "commands/speckit.questmaster.check-spec.md"
      description: "Specification Integrity assessment: spec.md against story.md, independently assessed, Drift Classification, decision-first report"
      aliases: ["speckit.quest-check-spec"]

    - name: "speckit.questmaster.check-plan"
      file: "commands/speckit.questmaster.check-plan.md"
      description: "Comprehension Checkpoint + Plan Integrity assessment: plan.md against story.md and spec.md, independently assessed"
      aliases: ["speckit.quest-check-plan"]

  # Materializes at .specify/extensions/questmaster/questmaster-config.yml on install
  # (ConfigManager's project-config layer). Layered, for free, with
  # .specify/extensions/questmaster/local-config.yml (gitignored per-developer override) and
  # SPECKIT_QUESTMASTER_<KEY> environment variables — see data-model.md's Scoring Rubric
  # Configuration section for how Questmaster's own rubric-sum/band validation sits on top of
  # this generic layering.
  config:
    - name: "questmaster-config.yml"
      template: "config/questmaster-config.template.yml"
      description: "Story/Specification/Plan rubrics, band anchors, readiness threshold, critical-condition list (FR-024)"
      required: true

  # Extension-provided templates always use 'replace' semantics — confirmed 2026-09-13e by
  # actually running `specify extension add --dev`, which rejects a `strategy:` key on an
  # extension-provided template entry outright ("'strategy' is not authorable for
  # extension-provided artifacts, which always use 'replace' semantics" —
  # src/specify_cli/extensions/__init__.py's `_validate_provided_artifacts`). The spec-template
  # PREPEND addendum this feature needs (FR-029) is therefore shipped as a companion PRESET
  # instead (`questmaster-pending-story`, at the repo root's `preset.yml`; research.md §14) —
  # presets are the only
  # manifest kind whose `provides.templates` entries support `strategy: prepend`
  # (presets/ARCHITECTURE.md's composition table). `story-template` has no such requirement
  # (it is a net-new template name, not an override of a core template) and stays here.
  templates:
    - name: "story-template"
      file: "templates/story-template.md"
      description: "9 core + 4 extended + 4 recorded Quest Story Structure skeleton (FR-003)"

  # provides.scripts — corrected 2026-09-13e (research.md §14): `ExtensionManager` DOES validate
  # a real `provides.scripts` section (`_validate_provided_artifacts(scripts, section="scripts",
  # ...)`), and the whole extension source directory — including this `scripts/` tree — is
  # copied wholesale to `.specify/extensions/questmaster/` on install (execute bits restored by
  # `ensure_executable_scripts`), landing at the documented `.specify/extensions/<id>/scripts/...`
  # path the source itself names. The original T004 finding (no scripts entry exists) was wrong;
  # see README.md § Helper script delivery for why the command skills still inline these
  # verbatim as heredocs anyway, as a deliberate simplicity/robustness choice now that both
  # options are confirmed to work, not a limitation being worked around.
  scripts:
    - name: "qm-config"
      file: "scripts/qm-config.sh"
      description: "Config loader/validator: resolves the effective rubric config with per-rubric fallback (FR-024, T006)"
    - name: "qm-score"
      file: "scripts/qm-score.sh"
      description: "Deterministic band-to-score arithmetic (FR-036, T007)"
    - name: "qm-digest"
      file: "scripts/qm-digest.sh"
      description: "Source-digest helper excluding the Questmaster Record section (FR-040, T008)"
    - name: "qm-record"
      file: "scripts/qm-record.sh"
      description: "Questmaster Record reader/writer: Judgment Ledger, Comprehension, Decisions (FR-027/FR-035/FR-039/FR-041, T009)"
    - name: "qm-readiness"
      file: "scripts/qm-readiness.sh"
      description: "Story readiness classifier (FR-012, T018)"
    - name: "qm-pending"
      file: "scripts/qm-pending.sh"
      description: "Pending-story file mechanics: write/relocate/discard with collision refusal (FR-029)"
    - name: "qm-report"
      file: "scripts/qm-report.sh"
      description: "Decision-first Integrity report renderer (FR-038)"
    - name: "qm-worklist"
      file: "scripts/qm-worklist.sh"
      description: "Decision Worklist top-item selector (FR-043)"

# Fires automatically (no `condition:` — research.md §4: an interactive agent session following
# templates/commands/*.md never evaluates a hook condition, so a conditioned hook here would
# silently never fire). `specify extension add questmaster` registers these into the project's
# .specify/extensions.yml (contracts/extensions.yml shows the resulting content); a project never
# hand-authors that file for Questmaster's sake.
hooks:
  after_specify:
    command: "speckit.questmaster.check-spec"
    optional: false
    description: "Relocate any pending story into the new feature directory, then assess Specification Integrity"

  after_plan:
    command: "speckit.questmaster.check-plan"
    optional: false
    description: "Run the Comprehension Checkpoint, then assess Plan Integrity"

tags:
  - "quality"
  - "specification"
  - "traceability"
  - "process"
